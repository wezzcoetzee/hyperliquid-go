name: nightly-integration
on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go test -tags=integration -race ./...
        env:
          HL_TESTNET_KEY: ${{ secrets.HL_TESTNET_KEY }}
